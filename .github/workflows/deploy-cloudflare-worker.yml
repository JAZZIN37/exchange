name: Deploy translation Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-translation-worker
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run Worker tests
        run: node --test worker/test/translate-worker.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
      SCHOOL_BOARD_USERNAME: ${{ secrets.SCHOOL_BOARD_USERNAME }}
      SCHOOL_BOARD_PASSWORD: ${{ secrets.SCHOOL_BOARD_PASSWORD }}
      SUBMISSION_ACCESS_CODE: ${{ secrets.SUBMISSION_ACCESS_CODE }}
    steps:
      - name: Check Worker deployment configuration
        id: worker
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$DEEPL_API_KEY" ] && [ -n "$SCHOOL_BOARD_USERNAME" ] && [ -n "$SCHOOL_BOARD_PASSWORD" ] && [ -n "$SUBMISSION_ACCESS_CODE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare, DeepL, or school publisher secrets are not configured; Worker deployment is skipped."
          fi

      - name: Check out source
        if: ${{ steps.worker.outputs.configured == 'true' }}
        uses: actions/checkout@v4

      - name: Deploy Cloudflare translation Worker
        if: ${{ steps.worker.outputs.configured == 'true' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          secrets: |
            DEEPL_API_KEY
            SCHOOL_BOARD_USERNAME
            SCHOOL_BOARD_PASSWORD
            SUBMISSION_ACCESS_CODE