name: Deploy translation Worker

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_test:
        description: "Create one clearly labelled public integration-test post"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-translation-worker
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run Worker tests
        run: node --test worker/test/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
      SCHOOL_BOARD_USERNAME: ${{ secrets.SCHOOL_BOARD_USERNAME }}
      SCHOOL_BOARD_PASSWORD: ${{ secrets.SCHOOL_BOARD_PASSWORD }}
      SUBMISSION_ACCESS_CODE: ${{ secrets.SUBMISSION_ACCESS_CODE }}
    steps:
      - name: Check Worker deployment configuration
        id: worker
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$DEEPL_API_KEY" ] && [ -n "$SCHOOL_BOARD_USERNAME" ] && [ -n "$SCHOOL_BOARD_PASSWORD" ] && [ -n "$SUBMISSION_ACCESS_CODE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare, DeepL, or school publisher secrets are not configured; Worker deployment is skipped."
          fi

      - name: Check out source
        if: ${{ steps.worker.outputs.configured == 'true' }}
        uses: actions/checkout@v4

      - name: Install Wrangler
        if: ${{ steps.worker.outputs.configured == 'true' }}
        run: npm install --global wrangler@4

      - name: Upload Worker secrets and deploy
        if: ${{ steps.worker.outputs.configured == 'true' }}
        working-directory: worker
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          names = ["DEEPL_API_KEY", "SCHOOL_BOARD_USERNAME", "SCHOOL_BOARD_PASSWORD", "SUBMISSION_ACCESS_CODE"]
          Path(".worker-secrets.json").write_text(json.dumps({name: os.environ[name] for name in names}), encoding="utf-8")
          PY
          wrangler secret bulk .worker-secrets.json
          rm -f .worker-secrets.json
          wrangler deploy

      - name: Publish a controlled integration-test post
        if: ${{ inputs.publish_test == true && steps.worker.outputs.configured == 'true' }}
        env:
          WORKER_ORIGIN: https://nz-exchange-news-translate.jazzin-kim.workers.dev
        run: |
          sleep 20
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          payload = {
              "accessCode": os.environ["SUBMISSION_ACCESS_CODE"],
              "title": "[자동게시 기능 점검] 국제교류 게시 테스트",
              "body": "이 글은 국제교류 프로그램의 자동게시 기능을 점검하기 위해 등록한 테스트 게시물입니다.",
              "translatedBody": "This is a test post created to verify the international-exchange automatic publishing feature.",
              "confirmed": True,
          }
          request = Request(
              os.environ["WORKER_ORIGIN"] + "/api/publish",
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json", "Origin": "https://jazzin37.github.io", "User-Agent": "Mozilla/5.0"},
              method="POST",
          )
          try:
              with urlopen(request, timeout=90) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except HTTPError as error:
              try:
                  result = json.loads(error.read().decode("utf-8"))
              except Exception:
                  raise SystemExit(f"Worker returned HTTP {error.code}")
          if not result.get("ok"):
              raise SystemExit(result.get("error", "test publication failed"))
          print("Test post published. Board post ID:", result.get("boardPostId", "unknown"))
          PY