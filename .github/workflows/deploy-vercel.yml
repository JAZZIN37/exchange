name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests in mock mode
        env:
          MOCK_TRANSLATION: "1"
        run: python -m unittest discover -s tests -v

      - name: Compile Python
        run: python -m compileall -q app.py api tests

      - name: Check page JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("static/index.html").read_text(encoding="utf-8")
          script = re.search(r"<script>([\s\S]*?)</script>", html)
          assert script, "inline page script not found"
          Path("/tmp/page-script.js").write_text(script.group(1), encoding="utf-8")
          PY
          node --check /tmp/page-script.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel deployment configuration
        id: vercel
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Vercel secrets are not configured; production deployment is skipped."
          fi

      - name: Check out source
        if: ${{ steps.vercel.outputs.configured == 'true' }}
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        if: ${{ steps.vercel.outputs.configured == 'true' }}
        run: npm install --global vercel@latest

      - name: Pull production settings
        if: ${{ steps.vercel.outputs.configured == 'true' }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production deployment
        if: ${{ steps.vercel.outputs.configured == 'true' }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production build
        if: ${{ steps.vercel.outputs.configured == 'true' }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
