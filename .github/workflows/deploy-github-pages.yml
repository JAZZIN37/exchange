name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests in mock mode
        env:
          MOCK_TRANSLATION: "1"
        run: python -m unittest discover -s tests -v

      - name: Run translation Worker tests
        run: node --test worker/test/translate-worker.test.mjs

      - name: Build static site
        env:
          TRANSLATION_API_BASE: ${{ vars.TRANSLATION_API_BASE }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          value = os.environ.get("TRANSLATION_API_BASE", "").strip().rstrip("/")
          if value and not re.fullmatch(r"https://[A-Za-z0-9.-]+(?::[0-9]+)?", value):
              raise SystemExit("TRANSLATION_API_BASE must be an HTTPS origin without a path")
          output = Path("_site")
          if output.exists():
              shutil.rmtree(output)
          shutil.copytree("static", output)
          (output / "runtime-config.js").write_text(
              f"window.NZ_API_BASE = {json.dumps(value)};\n", encoding="utf-8"
          )
          print(f"GitHub Pages API base: {value or '(not configured)'}")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4