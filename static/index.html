<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.json">
  <title>안성초등학교-바이테렉 과학기술학교 국제교육</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root{--ink:#17202b;--muted:#64748b;--paper:#fffdf7;--line:#17202b;--blue:#2563eb;--soft:#eef2f7;--editable:#fff8d8}
    *{box-sizing:border-box}
    body{margin:0;background:#e2e8f0;color:var(--ink);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}
    button{font:inherit}
    .app{max-width:1120px;margin:auto;padding:22px 18px 36px}
    .topbar{display:flex;justify-content:center;align-items:center;margin-bottom:16px}
    .brand{font-size:25px;font-weight:900;letter-spacing:-.06em}
    .paper-wrap{padding:10px}
    .paper{max-width:900px;min-height:1060px;margin:auto;padding:46px 58px 42px;background:var(--paper);border:1px solid #cbd5e1;border-radius:4px;box-shadow:0 20px 40px #0f172a1a}
    .paper-header{text-align:center;border-bottom:5px solid var(--line);padding-bottom:19px}
    .masthead{margin:0;font-family:Georgia,"Batang",serif;font-size:34px;line-height:1.25;letter-spacing:-.045em}
    .subtitle{margin-top:11px;font-size:18px;font-weight:800;line-height:1.45;letter-spacing:-.025em}
    .meta{display:flex;justify-content:space-between;gap:14px;border-bottom:2px solid var(--line);padding:11px 2px;margin-bottom:34px;font-size:13px;font-weight:800}
    .editable{outline:2px solid transparent;border-radius:5px;transition:background .15s,outline-color .15s}
    .editable:hover,.editable:focus{background:var(--editable);outline-color:#facc15}
    .editable:empty:before{content:attr(data-placeholder);color:#94a3b8;font-family:system-ui,sans-serif;font-size:18px;font-weight:500}
    .title{min-height:76px;margin-bottom:14px;text-align:center;font-family:Georgia,"Batang",serif;font-size:43px;font-weight:900;line-height:1.25;letter-spacing:-.045em}
    .translation-stack{display:flex;flex-direction:column;gap:8px;margin:-2px 0 27px}
    .translation-line{min-height:28px;padding:5px 7px;border-bottom:1px solid #cbd5e1;color:#475569;font-style:italic;line-height:1.55;white-space:pre-wrap}
    .translation-line:empty:before{content:attr(data-placeholder);color:#94a3b8;font-style:normal}
    [hidden]{display:none!important}
    .photo{position:relative;min-height:255px;margin-bottom:34px;border:1px dashed #94a3b8;background:#f1f5f9;display:grid;place-items:center;overflow:hidden;cursor:pointer;outline:2px solid transparent;transition:outline-color .15s,background .15s}
    .photo:hover,.photo:focus{outline-color:#facc15;background:#fff8d8}
    .photo img{display:block;width:100%;max-height:510px;object-fit:cover}
    .photo .empty{text-align:center;color:#64748b;line-height:1.7}
    .image-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
    .body{min-height:190px;padding:4px 5px;white-space:pre-wrap;font-size:18px;line-height:1.9;text-align:justify}
    .footer{display:flex;justify-content:space-between;border-top:2px solid var(--line);margin-top:58px;padding-top:16px;font-size:11px;font-weight:800;letter-spacing:.08em}
    .action-area{max-width:900px;margin:16px auto 0}
    .status{min-height:22px;margin:0 0 10px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}
    .status.error{color:#991b1b}.status.ok{color:#166534}
    .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .btn{padding:14px 12px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:900;cursor:pointer;box-shadow:0 5px 12px #0f172a22}
    .btn:hover{background:#263244}.btn:disabled{opacity:.55;cursor:wait}
    @media(max-width:850px){.app{padding:14px 9px 28px}.paper-wrap{padding:4px}.paper{padding:32px 22px 30px;min-height:auto}.masthead{font-size:29px}.partner-schools{font-size:15px;gap:7px}.title{font-size:33px;min-height:62px}.body{font-size:16px;line-height:1.8}.meta{font-size:11px}.actions{grid-template-columns:1fr}.footer{font-size:9px;letter-spacing:.04em}}
    @media print{body{background:#fff}.app{padding:0}.topbar,.action-area{display:none!important}.paper-wrap{padding:0}.paper{box-shadow:none;border:0;max-width:none}}
  </style>
</head>
<body>
  <main class="app">
    <section class="paper-wrap">
      <article class="paper" id="newspaper">
        <header class="paper-header">
          <h1 class="masthead">안성초등학교-바이테렉 과학기술학교 국제교육</h1>
          <div class="subtitle">Бәйтерек ғылым және технология мектебі - Начальная школа Ансон</div>
        </header>

        <div class="meta"><span id="today"></span><span>Friendship Through Education</span></div>

        <div class="title editable" id="previewTitle" contenteditable="true" role="textbox" aria-label="기사 제목" data-placeholder="제목을 입력해줘"></div>
        <div class="translation-stack" id="titleTranslations" aria-label="제목 번역">
          <div class="translation-line editable" id="titleTranslationKo" contenteditable="true" role="textbox" aria-label="제목 한국어 번역" hidden></div>
          <div class="translation-line editable" id="titleTranslationEn" contenteditable="true" role="textbox" aria-label="제목 영어 번역" hidden></div>
          <div class="translation-line editable" id="titleTranslationRu" contenteditable="true" role="textbox" aria-label="제목 러시아어 번역" hidden></div>
        </div>

        <label class="photo" id="photoBox" for="imageInput" tabindex="0" aria-label="교류 활동 사진 선택">
          <div class="empty" id="photoEmpty">📸<br>사진을 선택해줘</div>
          <img id="previewImage" alt="교류 활동 사진" hidden>
          <input class="image-input" id="imageInput" type="file" accept="image/*">
        </label>

        <div class="body editable" id="previewBody" contenteditable="true" role="textbox" aria-label="기사 본문" data-placeholder="기사 본문을 입력해줘"></div>
        <div class="translation-stack" id="bodyTranslations" aria-label="본문 번역">
          <div class="translation-line editable" id="bodyTranslationKo" contenteditable="true" role="textbox" aria-label="본문 한국어 번역" hidden></div>
          <div class="translation-line editable" id="bodyTranslationEn" contenteditable="true" role="textbox" aria-label="본문 영어 번역" hidden></div>
          <div class="translation-line editable" id="bodyTranslationRu" contenteditable="true" role="textbox" aria-label="본문 러시아어 번역" hidden></div>
        </div>

        <footer class="footer"><span>PARTNERSHIP FOR GLOBAL CITIZENS</span><span>PAGE 01 · 2026</span></footer>
      </article>
    </section>

    <section class="action-area" aria-label="신문 작업">
      <div class="status" id="status" aria-live="polite"></div>
      <div class="actions">
        <button class="btn" id="translateBtn" type="button">1. 자동번역</button>
        <button class="btn" id="prepareBtn" type="button">2. 게시판 자동 등록</button>
        <button class="btn" id="saveBtn" type="button">3. 이미지 저장</button>
      </div>
    </section>
  </main>

<script>
  const $ = id => document.getElementById(id);
  const BOARD_URL = 'https://anseong-e.goean.kr/anseong-e/na/ntt/insertNttPage.do?mi=6401&bbsId=3783';
  const API_BASE = window.NZ_API_BASE || '';
  const PAYLOAD_KEY = 'nz-exchange-news-payload-v1';
  const LANGUAGES = ['ko', 'en', 'ru'];
  let imageDataUrl = '';
  let imageName = 'exchange-news.png';

  $('today').textContent = new Date().toLocaleDateString('ko-KR', {year:'numeric', month:'2-digit', day:'2-digit'});

  function textOf(element) {
    return (element.innerText || element.textContent || '').replace(/\u00a0/g, ' ').trim();
  }

  function status(message, kind='') {
    $('status').textContent = message;
    $('status').className = `status ${kind}`;
  }

  function clearTranslations(prefix) {
    for (const language of LANGUAGES) {
      const line = $(`${prefix}Translation${language[0].toUpperCase()}${language.slice(1)}`);
      line.textContent = '';
      line.hidden = true;
    }
  }

  function showTranslations(prefix, result) {
    const translations = result.translations || {};
    for (const language of LANGUAGES) {
      const suffix = language[0].toUpperCase() + language.slice(1);
      const line = $(`${prefix}Translation${suffix}`);
      const value = String(translations[language] || '').trim();
      line.textContent = value;
      line.hidden = !value;
    }
  }

  function collectTranslations(prefix) {
    return LANGUAGES.map(language => {
      const suffix = language[0].toUpperCase() + language.slice(1);
      return textOf($(`${prefix}Translation${suffix}`));
    }).filter(Boolean).join('\n\n');
  }

  async function api(path, options = {}) {
    const response = await fetch(`${API_BASE}${path}`, {headers:{'Content-Type':'application/json'}, ...options});
    const data = await response.json().catch(() => ({}));
    if (!response.ok || !data.ok) throw new Error(data.error || `API 오류 (${response.status})`);
    return data;
  }

  $('previewTitle').addEventListener('input', () => clearTranslations('title'));
  $('previewBody').addEventListener('input', () => clearTranslations('body'));

  $('photoBox').addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); $('imageInput').click(); }
  });
  $('imageInput').addEventListener('change', event => {
    const file = event.target.files?.[0];
    if (!file) return;
    imageName = file.name || imageName;
    const reader = new FileReader();
    reader.onload = () => {
      imageDataUrl = String(reader.result);
      $('previewImage').src = imageDataUrl;
      $('previewImage').hidden = false;
      $('photoEmpty').hidden = true;
    };
    reader.readAsDataURL(file);
  });

  $('translateBtn').addEventListener('click', async () => {
    const title = textOf($('previewTitle'));
    const body = textOf($('previewBody'));
    if (!title && !body) return status('제목이나 본문을 먼저 입력해줘.', 'error');
    $('translateBtn').disabled = true;
    status('자동번역 중이야…');
    try {
      const jobs = [];
      if (title) jobs.push(api('/api/translate', {method:'POST', body:JSON.stringify({text:title})}).then(result => showTranslations('title', result)));
      if (body) jobs.push(api('/api/translate', {method:'POST', body:JSON.stringify({text:body})}).then(result => showTranslations('body', result)));
      await Promise.all(jobs);
      status('자동번역이 완료됐어. 번역문도 클릭해서 수정할 수 있어.', 'ok');
    } catch (error) {
      status(error.message, 'error');
    } finally {
      $('translateBtn').disabled = false;
    }
  });

  function getPayload() {
    return {
      title: textOf($('previewTitle')) || '국제교육신문',
      body: textOf($('previewBody')),
      translatedTitle: collectTranslations('title'),
      translatedBody: collectTranslations('body'),
      imageDataUrl,
      imageName,
      savedAt: new Date().toISOString()
    };
  }

  $('prepareBtn').addEventListener('click', () => {
    const payload = getPayload();
    if (!payload.body && !payload.imageDataUrl) return status('본문이나 사진을 먼저 준비해줘.', 'error');
    localStorage.setItem(PAYLOAD_KEY, JSON.stringify(payload));
    document.dispatchEvent(new CustomEvent('NZ_EXCHANGE_NEWS_PAYLOAD_READY', {detail:JSON.stringify(payload)}));
    window.open(`${BOARD_URL}&nzAutoFill=1`, '_blank', 'noopener');
    status('게시판 글쓰기 화면을 열었어. 로그인 후 제목·본문·이미지를 확인하고 게시판의 최종 등록 버튼을 눌러줘.', 'ok');
  });

  $('saveBtn').addEventListener('click', async () => {
    try {
      if (!window.html2canvas) return window.print();
      const canvas = await html2canvas($('newspaper'), {scale:2, backgroundColor:'#fffdf7', useCORS:true});
      const link = document.createElement('a');
      link.download = `${(textOf($('previewTitle')) || 'international-education-news').replace(/[\\/:*?"<>|]/g,'_')}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      status('신문 이미지를 저장했어.', 'ok');
    } catch (error) {
      status(`이미지 저장 실패: ${error.message}`, 'error');
    }
  });
</script>
</body>
</html>
